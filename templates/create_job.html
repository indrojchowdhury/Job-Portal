{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="max-width: 600px;">
    <h3 style="text-align: center; margin-bottom: 25px;">Post a New Job</h3>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Job Title:</label>
            <input type="text" name="title" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label>Company Name:</label>
            <input type="text" name="company_name" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label>Location:</label>
            <input type="text" name="location" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label>Salary:</label>
            <input type="text" name="salary">
        </div>
        <div style="margin-bottom: 20px;">
            <label>Description:</label>
            <textarea name="description" rows="5" style="width: 100%; border: 1px solid #ccc; border-radius: 5px; padding: 10px;"></textarea>
        </div>
        <button type="submit" class="auth-btn">POST JOB NOW</button>
    </form>
</div>
{% endblock %}
