{% extends 'base.html' %}

{% block content %}
<!-- Registration Form -->
<div class="auth-container">
    <h3 style="text-align: center;">REGISTER</h3>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-wrapper">
            {% for field in form %}
                <p>
                    {{ field.label_tag }} 
                    {{ field }}
                    {% if field.errors %}
                        <span class="errorlist" style="color: red; font-size: 12px;">{{ field.errors }}</span>
                    {% endif %}
                </p>
            {% endfor %}
        </div>
        <button type="submit">REGISTER</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account?</p>
        <a href="{% url 'login' %}">Login here</a>
    </div>
</div>
{% endblock %}
